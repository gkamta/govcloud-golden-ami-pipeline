# Ansible defaults for this repo. Packer invokes ansible with its own
# inventory (the builder instance). The dynamic aws_ec2 inventory is for
# post-bake operations against running, tagged instances.
[defaults]
roles_path = ./roles
inventory = inventories/aws_ec2.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
forks = 10
timeout = 30

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, yaml, ini

[privilege_escalation]
become = True
become_method = sudo
