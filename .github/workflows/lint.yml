# Offline-friendly lint and secret scan. Runs on every PR and push.
# Packer validate uses a placeholder AMI ID so it does not call AWS.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.9.8"
  PACKER_VERSION: "1.14.2"
  PYTHON_VERSION: "3.13"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks gitleaks.tgz
          gitleaks version
      - name: gitleaks (full git history)
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles('gitleaks.sarif') != '' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  packer:
    name: Packer fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: packer fmt
        run: packer fmt -check -recursive packer
      - name: packer init + validate (placeholder AMI, no AWS)
        run: |
          packer init packer/rhel9
          packer validate -var source_ami=ami-0123456789abcdef0 packer/rhel9
          packer init packer/windows2022
          packer validate -var source_ami=ami-0123456789abcdef0 packer/windows2022

  ansible:
    name: ansible-lint + yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: pip install "ansible-core>=2.16,<2.19" ansible-lint yamllint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint (ansible)
        run: yamllint -c .yamllint.yml ansible
      - name: ansible-lint
        run: ansible-lint ansible

  terraform-lint:
    name: terraform fmt / validate + tflint + checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff terraform
      - name: terraform validate (all roots, no backend)
        run: |
          for dir in terraform/envs/dev terraform/envs/prod terraform/bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.53.0
      - name: TFLint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl" --format=compact
      - name: Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        continue-on-error: true
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: checkov.sarif
          category: checkov
